<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Undiruv Tizimi Maketlari</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Showroom page: neutral shell, the app frame is the only loud object. */
:root{
  --bg:#F1F2F4;--fg:#14161A;--muted:#666C76;--line:#DADDE2;--panel:#FFFFFF;--accent:#1F4FD1;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D0E10;--fg:#ECEDEF;--muted:#8D929B;--line:#25282D;--panel:#16181B;--accent:#7FA2FF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D0E10;--fg:#ECEDEF;--muted:#8D929B;--line:#25282D;--panel:#16181B;--accent:#7FA2FF;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased}
.page{max-width:1360px;margin:0 auto;padding:32px 16px 64px}
.top{display:flex;flex-wrap:wrap;gap:16px 40px;justify-content:space-between;align-items:flex-end;margin-bottom:22px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font:800 clamp(28px,4vw,44px)/1.05 "Manrope",var(--font);margin:8px 0 10px;letter-spacing:-.02em}
.top p{margin:0;color:var(--muted);max-width:64ch;line-height:1.55;font-size:15px}
.controls{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;padding:14px 0 18px;border-bottom:1px solid var(--line);margin-bottom:24px}
.lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-right:6px}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center}
.pbtn{font:600 13px/1 var(--font);padding:11px 15px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.pbtn:hover{border-color:var(--fg)}
.pbtn.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vdesc{font-size:14px;color:var(--muted);margin:0 0 16px;line-height:1.5}
.vdesc b{color:var(--fg)}

/* Browser frame */
.frame{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel);box-shadow:0 30px 60px -30px rgba(0,0,0,.25)}
.chrome{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg)}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line);display:block}
.url{flex:1;min-width:0;font:500 12px/1 "JetBrains Mono",monospace;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ============ APP (skinned by data-v) ============ */
.app{
  --a-bg:#F5F7FA;--a-fg:#111827;--a-muted:#6B7280;--a-line:#E5E7EB;--a-card:#FFFFFF;
  --a-side:#0F2A5C;--a-side-fg:#C9D4EC;--a-side-on:#FFFFFF;--a-side-onbg:rgba(255,255,255,.12);
  --a-acc:#1F4FD1;--a-acc-soft:#E8EEFC;--a-ok:#15803D;--a-ok-soft:#DCFCE7;--a-warn:#B45309;--a-warn-soft:#FEF3C7;--a-bad:#B91C1C;--a-bad-soft:#FEE2E2;
  --a-radius:10px;--a-font:"Inter",system-ui,sans-serif;--a-head:"Inter",system-ui,sans-serif;
  display:grid;grid-template-columns:232px 1fr;min-height:760px;background:var(--a-bg);color:var(--a-fg);font-family:var(--a-font);font-size:14px
}
.app[data-v="b"]{
  --a-bg:#0B0F14;--a-fg:#E6EAF0;--a-muted:#8592A3;--a-line:#1E2630;--a-card:#121821;
  --a-side:#080B10;--a-side-fg:#6E7B8C;--a-side-on:#C6F432;--a-side-onbg:rgba(198,244,50,.1);
  --a-acc:#2DD4BF;--a-acc-soft:rgba(45,212,191,.12);--a-ok:#4ADE80;--a-ok-soft:rgba(74,222,128,.12);--a-warn:#FBBF24;--a-warn-soft:rgba(251,191,36,.12);--a-bad:#F87171;--a-bad-soft:rgba(248,113,113,.12);
  --a-radius:8px;grid-template-columns:72px 1fr
}
.app[data-v="c"]{
  --a-bg:#F7F3EE;--a-fg:#1C1917;--a-muted:#78716C;--a-line:#E7E0D7;--a-card:#FFFFFF;
  --a-side:#FFFFFF;--a-side-fg:#57534E;--a-side-on:#1C1917;--a-side-onbg:#F3ECE3;
  --a-acc:#E2531E;--a-acc-soft:#FDEBE3;--a-ok:#3F7D3A;--a-ok-soft:#E4F1E1;--a-warn:#A16207;--a-warn-soft:#FBF0D5;--a-bad:#B42318;--a-bad-soft:#FBE3E0;
  --a-radius:18px;--a-head:"Manrope",system-ui,sans-serif;grid-template-columns:1fr;grid-template-rows:auto 1fr
}

.side{background:var(--a-side);color:var(--a-side-fg);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;color:var(--a-side-on);font:700 15px/1.2 var(--a-head)}
.logo{width:30px;height:30px;border-radius:8px;background:var(--a-acc);display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;flex:none}
.brand small{display:block;font:500 11px/1.3 var(--a-font);color:var(--a-side-fg)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;color:inherit;text-decoration:none;font-weight:500;cursor:pointer;white-space:nowrap}
.nav a svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a.on{background:var(--a-side-onbg);color:var(--a-side-on)}
.nav a .cnt{margin-left:auto;font-size:11px;font-weight:700;background:var(--a-acc);color:#fff;border-radius:999px;padding:2px 7px}
.side .me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 8px;border-top:1px solid rgba(255,255,255,.08)}
.ava{width:32px;height:32px;border-radius:50%;background:var(--a-acc-soft);color:var(--a-acc);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.me b{display:block;color:var(--a-side-on);font-size:13px}.me span{font-size:11px}

/* B: icon-only rail */
.app[data-v="b"] .side{align-items:center;padding:16px 10px;border-right:1px solid var(--a-line)}
.app[data-v="b"] .brand{padding:0 0 18px}.app[data-v="b"] .brand .t,.app[data-v="b"] .nav a .t,.app[data-v="b"] .nav a .cnt,.app[data-v="b"] .me div{display:none}
.app[data-v="b"] .logo{background:var(--a-side-on);color:#0B0F14}
.app[data-v="b"] .nav a{justify-content:center;padding:11px;position:relative}
.app[data-v="b"] .nav a.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--a-side-on)}
.app[data-v="b"] .me{border-top-color:var(--a-line);padding:12px 0 0}

/* C: horizontal top nav */
.app[data-v="c"] .side{flex-direction:row;align-items:center;gap:18px;padding:12px 22px;border-bottom:1px solid var(--a-line);flex-wrap:wrap}
.app[data-v="c"] .brand{padding:0;color:var(--a-fg)}.app[data-v="c"] .brand small{color:var(--a-muted)}
.app[data-v="c"] .logo{border-radius:50%}
.app[data-v="c"] .nav{flex-direction:row;flex-wrap:wrap;gap:4px}
.app[data-v="c"] .nav a{border-radius:999px;padding:8px 14px}.app[data-v="c"] .nav a svg{display:none}
.app[data-v="c"] .me{margin:0 0 0 auto;border:0;padding:0}.app[data-v="c"] .me b{color:var(--a-fg)}

.main{padding:22px 26px 30px;min-width:0;display:flex;flex-direction:column;gap:18px}
.app[data-v="c"] .main{padding:26px 28px 34px;gap:22px}
.head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
.head h2{margin:0;font:700 22px/1.2 var(--a-head);letter-spacing:-.01em}
.app[data-v="c"] .head h2{font-size:28px;font-weight:800}
.head p{margin:4px 0 0;color:var(--a-muted);font-size:13px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;background:var(--a-card);border:1px solid var(--a-line);border-radius:8px;padding:8px 12px;color:var(--a-muted);font-size:13px;min-width:220px}
.app[data-v="c"] .search{border-radius:999px}
.btn{font:600 13px/1 var(--a-font);border-radius:8px;padding:10px 14px;border:1px solid var(--a-line);background:var(--a-card);color:var(--a-fg);cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--a-acc);border-color:var(--a-acc);color:#fff}
.app[data-v="b"] .btn.pri{color:#04201C}
.app[data-v="c"] .btn{border-radius:999px}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{background:var(--a-card);border:1px solid var(--a-line);border-radius:var(--a-radius);padding:16px 18px;min-width:0}
.app[data-v="c"] .card{border:0;box-shadow:0 1px 2px rgba(28,25,23,.06)}
.kpi .k{font-size:12px;color:var(--a-muted);font-weight:500}
.kpi .v{font:700 24px/1.15 var(--a-head);margin:8px 0 6px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.app[data-v="b"] .kpi .v{font-family:"JetBrains Mono",monospace;font-size:22px}
.app[data-v="c"] .kpi .v{font-size:28px;font-weight:800}
.kpi .v small{font-size:13px;font-weight:600;color:var(--a-muted)}
.delta{font-size:12px;font-weight:600}.up{color:var(--a-ok)}.dn{color:var(--a-bad)}
.bar{height:6px;background:var(--a-line);border-radius:99px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--a-acc);border-radius:99px}
.app[data-v="c"] .kpi:first-child{background:var(--a-fg);color:#fff}.app[data-v="c"] .kpi:first-child .k,.app[data-v="c"] .kpi:first-child .v small{color:#D6D3D1}

.grid2{display:grid;grid-template-columns:minmax(0,2fr) minmax(300px,1fr);gap:14px;align-items:start}
.ctitle{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.ctitle h3{margin:0;font:700 15px/1.2 var(--a-head)}
.app[data-v="c"] .ctitle h3{font-size:17px}
.ctitle span{font-size:12px;color:var(--a-muted)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs b{font-size:12px;font-weight:600;padding:6px 10px;border-radius:6px;color:var(--a-muted);cursor:pointer}
.tabs b.on{background:var(--a-acc-soft);color:var(--a-acc)}
.app[data-v="c"] .tabs b{border-radius:999px}

.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tw{overflow-x:auto}
.tbl th{text-align:left;font-weight:600;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--a-muted);padding:8px 10px;border-bottom:1px solid var(--a-line);white-space:nowrap}
.tbl td{vertical-align:middle;padding:10px;border-bottom:1px solid var(--a-line);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}.tbl tbody tr:hover td{background:var(--a-acc-soft)}
.tbl tr.sel td{background:var(--a-acc-soft)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.app[data-v="b"] .num{font-family:"JetBrains Mono",monospace;font-size:12px}
.who b{display:block;font-weight:600}.who span{font-size:12px;color:var(--a-muted)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--a-acc-soft);color:var(--a-acc)}
.pill.ok{background:var(--a-ok-soft);color:var(--a-ok)}.pill.warn{background:var(--a-warn-soft);color:var(--a-warn)}.pill.bad{background:var(--a-bad-soft);color:var(--a-bad)}
.act{display:inline-flex;align-items:center;gap:6px;font-weight:500}
.act svg{width:15px;height:15px;stroke:var(--a-muted);fill:none;stroke-width:1.8}

/* Debtor card */
.dhead{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.dhead .ava{width:44px;height:44px;font-size:15px}
.dhead b{font-size:16px;display:block}.dhead span{font-size:12px;color:var(--a-muted)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:13px;margin:0 0 14px}
.dl dt{color:var(--a-muted)}.dl dd{margin:0;text-align:right;font-weight:500;font-variant-numeric:tabular-nums}
.dl dd.tot{font-weight:700;font-size:15px;color:var(--a-bad)}
.sep{height:1px;background:var(--a-line);margin:12px 0}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns .btn{text-align:center}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.tl li{display:grid;grid-template-columns:10px 1fr;gap:10px;font-size:13px}
.tl li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--a-acc);margin-top:5px}
.tl li.w::before{background:var(--a-warn)}.tl li.b::before{background:var(--a-bad)}.tl li.g::before{background:var(--a-ok)}
.tl small{display:block;color:var(--a-muted);font-size:11px;margin-top:2px}

/* Chart */
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--a-muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:2px;margin:6px 0 14px}
.stack i{display:block;height:100%}
.slist{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;font-size:13px}
.slist div{display:flex;align-items:center;gap:8px}.slist i{width:10px;height:10px;border-radius:3px;flex:none}
.slist b{margin-left:auto;font-variant-numeric:tabular-nums}
.rank{width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;line-height:1;font-size:11px;font-weight:700;background:var(--a-line);color:var(--a-muted)}
.rank.lead{background:var(--a-acc);color:#fff}
.app[data-v="b"] .rank.lead{color:#04201C}
.mini{display:flex;align-items:center;gap:8px}.mini .bar{flex:1;margin:0;min-width:60px}

/* Spreadsheet view */
.sheetcard{padding:0;overflow:hidden;display:flex;flex-direction:column}
.fbar{display:flex;align-items:stretch;border-bottom:1px solid var(--a-line);font-size:13px}
.nbox{width:76px;flex:none;padding:8px 10px;border-right:1px solid var(--a-line);font:500 12px/1.4 "JetBrains Mono",monospace;color:var(--a-muted)}
.fx{padding:8px 10px;border-right:1px solid var(--a-line);color:var(--a-muted);font-style:italic;font-weight:600}
.fval{flex:1;min-width:0;padding:8px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fval .lock{color:var(--a-muted);font-size:12px;margin-left:8px}
.gwrap{overflow:auto;max-height:520px;outline:none;position:relative}
.sh{border-collapse:separate;border-spacing:0;font-size:13px;table-layout:fixed}
.sh th,.sh td{border-right:1px solid var(--a-line);border-bottom:1px solid var(--a-line);height:32px;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--a-card)}
.sh thead th{position:sticky;z-index:2;background:var(--a-bg);font-weight:600;color:var(--a-muted)}
.sh thead tr.letters th{top:0;height:22px;font:500 11px/1 "JetBrains Mono",monospace;text-align:center}
.sh thead tr.names th{top:22px;text-align:left;color:var(--a-fg);cursor:pointer;user-select:none}
.sh thead tr.names th .ar{float:right;color:var(--a-muted);font-size:10px}
.sh thead tr.names th.ro{color:var(--a-muted)}
.sh .rn{position:sticky;left:0;z-index:1;width:44px;text-align:center;background:var(--a-bg);color:var(--a-muted);font:500 11px/1 "JetBrains Mono",monospace;padding:0}
.sh thead .rn{z-index:3}
.sh .fio{position:sticky;left:44px;z-index:1;box-shadow:2px 0 0 var(--a-line)}
.sh thead .fio{z-index:3}
.sh td.ro{color:var(--a-muted)}
.sh td.ro.fio{color:var(--a-fg);font-weight:500}
.sh td.num{text-align:right;font-variant-numeric:tabular-nums}
.sh td.hot{background:var(--a-bad-soft);color:var(--a-bad);font-weight:600}
.sh td.warm{background:var(--a-warn-soft);color:var(--a-warn);font-weight:600}
.sh td.cur{outline:2px solid var(--a-acc);outline-offset:-2px;position:relative;z-index:1}
.sh tr.rsel td.rn{background:var(--a-acc-soft);color:var(--a-acc)}
.sh td[contenteditable="true"]{outline:2px solid var(--a-acc);outline-offset:-2px;background:var(--a-card);color:var(--a-fg);text-overflow:clip;cursor:text;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.sh td.sel{padding:0 4px}
.sh select{width:100%;font:600 12px/1 var(--a-font);border:0;border-radius:999px;padding:4px 8px;background:var(--a-acc-soft);color:var(--a-acc);cursor:pointer;appearance:none;-webkit-appearance:none}
.sh select.ok{background:var(--a-ok-soft);color:var(--a-ok)}.sh select.warn{background:var(--a-warn-soft);color:var(--a-warn)}.sh select.bad{background:var(--a-bad-soft);color:var(--a-bad)}.sh select.none{background:transparent;color:var(--a-muted)}
.sh tfoot td{position:sticky;bottom:0;background:var(--a-bg);font-weight:700;z-index:1}
.sfoot{display:flex;align-items:center;gap:4px;border-top:1px solid var(--a-line);padding:0 8px;background:var(--a-bg);flex-wrap:wrap}
.stab{font:600 12px/1 var(--a-font);padding:10px 14px;border:0;background:none;color:var(--a-muted);cursor:pointer;border-top:2px solid transparent;margin-top:-1px}
.stab.on{color:var(--a-acc);border-top-color:var(--a-acc);background:var(--a-card)}
.stab small{font-weight:500;opacity:.7;margin-left:4px}
.sinfo{margin-left:auto;font-size:12px;color:var(--a-muted);padding:8px 6px;font-variant-numeric:tabular-nums}
.saved{font-size:12px;color:var(--a-ok);font-weight:600}
.hintrow{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--a-muted)}
.hintrow kbd{font:500 11px/1 "JetBrains Mono",monospace;border:1px solid var(--a-line);border-bottom-width:2px;border-radius:4px;padding:2px 5px;background:var(--a-card);color:var(--a-fg)}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}}
@media (max-width:760px){
  .app,.app[data-v="b"]{grid-template-columns:1fr}
  .side,.app[data-v="b"] .side{flex-direction:row;align-items:center;overflow-x:auto;padding:10px 12px;gap:10px}
  .brand{padding:0}.brand .t{display:none}
  .nav{flex-direction:row}.nav a .t{display:none}.app[data-v="c"] .nav a svg{display:block}.nav a .cnt{display:none}
  .side .me{display:none}
  .main,.app[data-v="c"] .main{padding:16px 12px 22px}
  .kpis{gap:10px}.search{min-width:0;flex:1}
}
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div>
      <div class="eyebrow">Bosqich 0 · Maketlar</div>
      <h1>Undiruv tizimi</h1>
      <p>Xodim paneli va rahbariyat uchun admin panel. Uch xil dizayn yo'nalishi bor: variant va panelni tanlab ko'ring. Jadval qatorini bossangiz, o'ngdagi qarzdor kartasi o'zgaradi.</p>
    </div>
  </header>

  <div class="controls">
    <div class="seg" role="group" aria-label="Variant">
      <span class="lbl">Variant</span>
      <button class="pbtn on" data-set-v="a">A · Klassik</button>
      <button class="pbtn" data-set-v="b">B · Tungi</button>
      <button class="pbtn" data-set-v="c">C · Ixcham</button>
    </div>
    <div class="seg" role="group" aria-label="Panel">
      <span class="lbl">Panel</span>
      <button class="pbtn on" data-set-p="emp">Xodim paneli</button>
      <button class="pbtn" data-set-p="sheet">Xodim: mijozlar jadvali</button>
      <button class="pbtn" data-set-p="adm">Rahbariyat paneli</button>
    </div>
  </div>

  const widths = `<colgroup><col style="width:44px">${COLS.map(c=>`<col style="width:${c.w}px">`).join('')}</colgroup>`;
  const head = `<thead><tr class="letters"><th class="rn"></th>${COLS.map((c,i)=>`<th class="${c.k==='fio'?'fio':''}">${LET(i)}</th>`).join('')}</tr>
    <tr class="names"><th class="rn">#</th>${COLS.map(c=>`<th class="${c.ro?'ro':''} ${c.k==='fio'?'fio':''}" data-sort="${c.k}" title="Saralash">${c.t}${c.ro?' 🔒':''}<span class="ar">${SH.sort===c.k?(SH.dir>0?'▲':'▼'):'⇅'}</span></th>`).join('')}</tr></thead>`;
  const body = rows.map((x,ri)=>`<tr data-ri="${ri}"><td class="rn">${ri+1}</td>${COLS.map((c,ci)=>cellHTML(x.r,c,ci,ri)).join('')}</tr>`).join('');
  const foot = `<tfoot><tr><td class="rn">Σ</td><td class="fio">Jami: ${rows.length} ta</td><td></td><td></td><td class="num">${fmt(total)}</td>${'<td></td>'.repeat(COLS.length-4)}</tr></tfoot>`;
  const tabs = TABS.map(t=>`<button class="stab ${SH.tab===t[0]?'on':''}" data-tab="${t[0]}">${t[1]}<small>${ROWS.filter(t[2]).length}</small></button>`).join('');
  return `<main class="main">
    <div class="head">
      <div><h2>Mijozlar jadvali</h2><p>Menga biriktirilgan ${ROWS.length} ta mijoz · <span class="saved" id="saved">✓ Barcha o'zgarishlar saqlandi</span></p></div>
      <div class="tools"><div class="search">${ico('search').replace('<svg','<svg width="16" height="16" style="stroke:currentColor;fill:none;stroke-width:2"')} Jadvaldan qidirish</div><button class="btn">Filtr</button><button class="btn pri">Excel'ga eksport</button></div>
    </div>
    <section class="card sheetcard">
      <div class="fbar"><div class="nbox" id="nbox"></div><div class="fx">fx</div><div class="fval" id="fval"></div></div>
      <div class="gwrap" id="gwrap" tabindex="0"><table class="sh" style="width:${44+COLS.reduce((s,c)=>s+c.w,0)}px">${widths}${head}<tbody>${body}</tbody>${foot}</table></div>
      <div class="sfoot">${tabs}<div class="sinfo" id="sinfo"></div></div>
    </section>
    <div class="hintrow"><span><kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> harakat</span><span><kbd>Enter</kbd> yoki ikki marta bosish: tahrirlash</span><span>Yozishni boshlasangiz, katak darhol tahrirlanadi</span><span><kbd>Esc</kbd> bekor qilish</span><span>🔒 Tizim ustunlarini (qarz, DPD, shartnoma) xodim o'zgartira olmaydi</span></div>
  </main>`;
}
function shCell(r=SH.r,c=SH.c){return document.querySelector(`#gwrap td[data-r="${r}"][data-c="${c}"]`)}
function shSelect(r,c){
  const n = shRows().length; if(!n) return;
  SH.r = Math.max(0,Math.min(n-1,r)); SH.c = Math.max(0,Math.min(COLS.length-1,c));
  document.querySelectorAll('#gwrap td.cur').forEach(td=>td.classList.remove('cur'));
  document.querySelectorAll('#gwrap tr.rsel').forEach(tr=>tr.classList.remove('rsel'));
  const td = shCell(); if(!td) return;
  td.classList.add('cur'); td.parentElement.classList.add('rsel');
  td.scrollIntoView({block:'nearest',inline:'nearest'});
  const col = COLS[SH.c], row = shRows()[SH.r].r;
  document.getElementById('nbox').textContent = LET(SH.c)+(SH.r+1);
  document.getElementById('fval').innerHTML = `${col.k==='sum'?fmt(row.sum):row[col.k]}${col.ro?'<span class="lock">🔒 tizim maydoni</span>':''}`;
  document.getElementById('sinfo').textContent = `${row.fio.split(' ').slice(0,2).join(' ')} · ${row.c}`;
}
function shFlashSaved(){const s=document.getElementById('saved'); if(!s) return; s.textContent='Saqlanmoqda…'; setTimeout(()=>{s.textContent='✓ Barcha o\'zgarishlar saqlandi'},500)}
function shEdit(initial){
  const col = COLS[SH.c], td = shCell(); if(!td) return;
  if (col.ro){ const f=document.getElementById('fval'); f.querySelector('.lock')?.animate([{opacity:.2},{opacity:1}],{duration:300,iterations:2}); return; }
  if (col.opts){ td.querySelector('select').focus(); return; }
  SH.editing = true; const old = td.textContent;
  td.contentEditable = 'true'; td.focus();
  if (initial!==undefined) td.textContent = initial;
  const rg = document.createRange(); rg.selectNodeContents(td); rg.collapse(false); const s=getSelection(); s.removeAllRanges(); s.addRange(rg);
  td.onkeydown = e=>{
    if (e.key==='Enter'||e.key==='Tab'){e.preventDefault(); finish(true); e.key==='Enter'?shSelect(SH.r+1,SH.c):shSelect(SH.r,SH.c+1)}
    else if (e.key==='Escape'){e.preventDefault(); td.textContent=old; finish(false)}
    e.stopPropagation();
  };
  td.onblur = ()=>finish(true);
  function finish(save){
    if(!SH.editing) return; SH.editing=false; td.contentEditable='false'; td.onblur=null; td.onkeydown=null;
    if (save && td.textContent!==old){ shRows()[SH.r].r[col.k]=td.textContent.trim(); shFlashSaved(); }
    document.getElementById('gwrap').focus({preventScroll:true}); shSelect(SH.r,SH.c);
  }
}
function bindSheet(){
  const g = document.getElementById('gwrap');
  g.addEventListener('mousedown', e=>{const td=e.target.closest('td[data-c]'); if(td&&!SH.editing){shSelect(+td.dataset.r,+td.dataset.c); if(e.target.tagName!=='SELECT'){e.preventDefault(); g.focus({preventScroll:true})}}});
  g.addEventListener('dblclick', e=>{if(e.target.closest('td[data-c]')) shEdit()});
  g.addEventListener('keydown', e=>{
    if (SH.editing || e.target.tagName==='SELECT') return;
    const m = {ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1],Tab:[0,e.shiftKey?-1:1]}[e.key];
    if (m){e.preventDefault(); shSelect(SH.r+m[0],SH.c+m[1]);}
    else if (e.key==='Enter'||e.key==='F2'){e.preventDefault(); shEdit();}
    else if (e.key.length===1 && !e.ctrlKey && !e.metaKey){e.preventDefault(); shEdit(e.key);}
  });
  g.addEventListener('change', e=>{const s=e.target; if(s.tagName!=='SELECT') return;
    const td=s.closest('td'), col=COLS[+td.dataset.c]; shRows()[+td.dataset.r].r[col.k]=s.value; s.className=col.opts[s.value]??''; shFlashSaved(); g.focus({preventScroll:true}); shSelect(+td.dataset.r,+td.dataset.c);
  });
  document.querySelectorAll('[data-sort]').forEach(th=>th.onclick=()=>{const k=th.dataset.sort; SH.dir = SH.sort===k ? -SH.dir : 1; SH.sort=k; render()});
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{SH.tab=b.dataset.tab; SH.r=0; render()});
  shSelect(SH.r,SH.c);
}

const URLS = {emp:'undiruv.uz/xodim/vazifalar', sheet:'undiruv.uz/xodim/mijozlar', adm:'undiruv.uz/admin/dashboard'};
function render(){
  const app = document.getElementById('app');
  app.dataset.v = V;
  app.innerHTML = side() + ({emp:empMain, sheet:sheetMain, adm:admMain})[P]();
  document.getElementById('vdesc').innerHTML = VDESC[V];
  document.getElementById('url').textContent = URLS[P];
  app.querySelectorAll('tbody tr[data-i]').forEach(tr=>tr.onclick=()=>{SEL=+tr.dataset.i;render()});
  if (P==='sheet') bindSheet();
}
document.querySelectorAll('[data-set-v]').forEach(b=>b.onclick=()=>{V=b.dataset.setV;document.querySelectorAll('[data-set-v]').forEach(x=>x.classList.toggle('on',x===b));render()});
document.querySelectorAll('[data-set-p]').forEach(b=>b.onclick=()=>{P=b.dataset.setP;document.querySelectorAll('[data-set-p]').forEach(x=>x.classList.toggle('on',x===b));render()});
render();
</script>
