<title>Imron Med Premium</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,600;1,6..96,500&family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: quiet showroom page; three premium phone prototypes are the only loud objects on it. */
:root{
  --bg:#F2F2EF;--fg:#121412;--muted:#6C706B;--line:#DCDDD8;--panel:#FFFFFF;--accent:#0E5A47;
  --font:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;--serif:"Instrument Serif",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E0F0E;--fg:#EDEDE8;--muted:#8F938D;--line:#242624;--panel:#161716;--accent:#5FC2A4;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E0F0E;--fg:#EDEDE8;--muted:#8F938D;--line:#242624;--panel:#161716;--accent:#5FC2A4;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);margin:0;-webkit-font-smoothing:antialiased}
.page{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:36px 64px}
.top{display:flex;flex-wrap:wrap;gap:20px 40px;align-items:flex-end;justify-content:space-between;margin-bottom:26px}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.top h1{font:400 clamp(36px,5vw,58px)/1 var(--serif);margin:10px 0 12px;letter-spacing:-.01em;text-wrap:balance}
.top h1 em{font-style:italic;color:var(--accent)}
.top p{margin:0;color:var(--muted);max-width:60ch;line-height:1.6;font-size:15px}
.ctrl{display:flex;gap:8px;flex-wrap:wrap}
.pbtn{font:600 13px/1 var(--font);padding:12px 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;transition:border-color .2s}
.pbtn:hover{border-color:var(--fg)}
.pbtn.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.modes{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:10px 0 18px;border-bottom:1px solid var(--line);margin-bottom:30px}
.modes .lbl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.hint{font-size:13px;color:var(--muted);margin:-14px 0 28px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:44px 28px;justify-items:center}
.variant{display:flex;flex-direction:column;gap:16px;align-items:center;width:100%;max-width:372px;min-width:0}
.vhead{width:100%;display:flex;flex-direction:column;gap:4px}
.vhead .num{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.vhead h2{margin:0;font:400 30px/1.05 var(--serif)}
.vhead p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.5}
.swatches{display:flex;gap:6px;margin-top:8px}
.swatches i{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(127,127,127,.3)}
.host{width:100%;display:flex;justify-content:center}

/* ================= Phone shell ================= */
.phone{
  --bg:#F4F5F2;--bg-img:none;--surface:#FFFFFF;--surface2:#F0F2EF;--ink:#0C1B17;--muted:#6B7772;--hair:rgba(12,27,23,.08);
  --accent:#0E5A47;--accent-ink:#FFFFFF;--accent-grad:linear-gradient(135deg,#17775E,#0B4637);--cash:#A8844F;
  --card-tint:#F3F5F2;--shadow:0 1px 2px rgba(12,27,23,.05),0 10px 26px -14px rgba(12,27,23,.18);--blur:none;
  --f-body:"Geist",system-ui,sans-serif;--f-display:"Instrument Serif",Georgia,serif;--f-num:"Geist",system-ui,sans-serif;
  --dw:400;--dls:-.01em;--r-xl:28px;--r-lg:22px;--r-md:16px;--r-sm:12px;
  --club:linear-gradient(140deg,#13664F 0%,#0B3F33 55%,#082C24 100%);--club-ink:#F3EEDF;--club-line:rgba(226,201,150,.35);--club-acc:#E2C996;
  position:relative;width:100%;max-width:360px;height:min(760px,calc(100dvh - 24px));min-height:560px;border-radius:54px;padding:10px;
  background:linear-gradient(150deg,#3A3D41 0%,#141517 40%,#2B2D30 100%);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.12),0 40px 80px -40px rgba(0,0,0,.55),0 18px 30px -20px rgba(0,0,0,.35);
}
.phone::before,.phone::after{content:"";position:absolute;width:3px;border-radius:2px;background:#2A2C2F}
.phone::before{left:-3px;top:150px;height:64px}
.phone::after{right:-3px;top:190px;height:96px}
.screen{position:relative;height:100%;border-radius:44px;overflow:hidden;background:var(--bg);background-image:var(--bg-img);color:var(--ink);font-family:var(--f-body);font-size:14px;isolation:isolate}
.sbar{position:absolute;top:0;left:0;right:0;height:50px;display:flex;justify-content:space-between;align-items:center;padding:4px 30px 0 34px;font:600 14px var(--f-body);z-index:40;color:var(--ink);pointer-events:none;letter-spacing:-.01em}
.sbar .ic{display:flex;gap:6px;align-items:center}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:110px;height:32px;border-radius:20px;background:#000;z-index:60;display:flex;align-items:center;gap:10px;padding:0 14px;color:#fff;overflow:hidden;
  transition:width .45s cubic-bezier(.3,1.3,.5,1),height .45s cubic-bezier(.3,1.3,.5,1),border-radius .45s;font:600 13px/1.3 var(--f-body)}
.island .ii{opacity:0;transition:opacity .2s;display:flex;align-items:center;gap:10px;white-space:nowrap;min-width:0}
.island .ii i{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;background:#1F8A62}
.island .ii i svg{width:14px;height:14px}
.island .ii span{overflow:hidden;text-overflow:ellipsis}
.island.show{width:calc(100% - 22px);height:50px;border-radius:26px}
.island.show .ii{opacity:1;transition-delay:.15s}
.homebar{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:128px;height:5px;border-radius:3px;background:var(--ink);opacity:.85;z-index:55;pointer-events:none}
.view{position:absolute;inset:0;padding-top:50px;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 18px 118px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.disp{font-family:var(--f-display);font-weight:var(--dw);letter-spacing:var(--dls)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button{font-family:inherit}
.screen button:focus-visible,.screen input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ================= Splash ================= */
.splash{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--sp-bg);color:var(--sp-ink);overflow:hidden}
.splash .glow{position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,var(--sp-glow) 0%,transparent 62%);animation:glow 3s ease-out both}
.splash .mk{position:relative;width:96px;height:96px}
.splash .mk .ring{fill:none;stroke:var(--sp-acc);stroke-width:1.6;stroke-dasharray:252;stroke-dashoffset:252;animation:draw 1.2s .1s cubic-bezier(.6,0,.2,1) forwards}
.splash .mk .cross{fill:none;stroke:var(--sp-acc);stroke-width:1.6;stroke-linejoin:round;stroke-dasharray:200;stroke-dashoffset:200;animation:draw 1s .5s cubic-bezier(.6,0,.2,1) forwards,crossFill .5s 1.3s forwards}
.splash .word{position:relative;display:flex;align-items:baseline;gap:8px;font-family:var(--sp-font);font-size:var(--sp-size);font-weight:var(--sp-w);letter-spacing:var(--sp-ls);line-height:1}
.splash .word span{display:inline-block;opacity:0;filter:blur(8px);transform:translateY(10px);animation:wordIn .9s cubic-bezier(.2,.8,.2,1) forwards}
.splash .word span:nth-child(1){animation-delay:1.05s}
.splash .word span:nth-child(2){animation-delay:1.25s;font-style:var(--sp-italic)}
.splash .word::after{content:"";position:absolute;inset:-10px -30px;background:linear-gradient(100deg,transparent 35%,var(--sp-sheen) 50%,transparent 65%);transform:translateX(-120%);animation:sheen 1s 2s ease-in-out forwards;mix-blend-mode:var(--sp-blend)}
.splash .rule{width:0;height:1px;background:var(--sp-acc);opacity:.6;animation:rule .9s 1.6s cubic-bezier(.6,0,.2,1) forwards}
.splash .tag{font:600 10.5px var(--f-body);letter-spacing:.32em;text-transform:uppercase;opacity:0;animation:fadeIn .8s 1.9s forwards}
.splash .timer{position:absolute;bottom:58px;width:42px;height:2px;border-radius:2px;background:color-mix(in srgb,var(--sp-ink) 18%,transparent);overflow:hidden}
.splash .timer i{display:block;height:100%;width:100%;background:var(--sp-acc);transform-origin:left;animation:timer 3s linear both}
.splash.out{animation:splashOut .5s cubic-bezier(.6,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes crossFill{to{fill:var(--sp-acc)}}
@keyframes wordIn{to{opacity:1;filter:none;transform:none}}
@keyframes sheen{to{transform:translateX(120%)}}
@keyframes rule{to{width:120px}}
@keyframes fadeIn{to{opacity:.75}}
@keyframes timer{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes glow{0%{transform:scale(.4);opacity:0}60%{opacity:1}100%{transform:scale(1.15);opacity:.9}}
@keyframes splashOut{to{opacity:0;transform:scale(1.06);filter:blur(6px)}}
.splash .blob{position:absolute;border-radius:50%;filter:blur(40px);opacity:.85}

/* ================= Register ================= */
.reg{padding:26px 24px 30px;display:flex;flex-direction:column;gap:14px;height:100%;overflow-y:auto;scrollbar-width:none}
.reg .brand{display:flex;align-items:center;gap:10px;font:600 15px var(--f-body);letter-spacing:.02em}
.reg .brand svg{width:30px;height:30px;color:var(--accent)}
.reg h3{margin:26px 0 0;font-size:40px;line-height:1.02;text-wrap:balance}
.reg h3 em{font-style:italic;color:var(--accent)}
.reg .sub{margin:2px 0 12px;color:var(--muted);line-height:1.55;font-size:14px}
.fl{position:relative;background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-md);transition:border-color .2s,box-shadow .2s;box-shadow:var(--shadow);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.fl:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 14%,transparent)}
.fl input{width:100%;border:0;background:transparent;outline:none;color:var(--ink);font:500 16px var(--f-body);padding:26px 16px 10px}
.fl label{position:absolute;left:16px;top:17px;font-size:15px;color:var(--muted);transition:.18s;pointer-events:none}
.fl input:focus+label,.fl input:not(:placeholder-shown)+label{top:9px;font-size:11.5px;letter-spacing:.04em}
.fl.ph input{padding-left:68px}
.fl.ph .cc{position:absolute;left:16px;top:26px;font:500 16px var(--f-num);color:var(--muted)}
.fl.err{border-color:#D64545}
.ferr{font-size:12px;color:#D64545;margin:-8px 4px 0}
.cta{position:relative;overflow:hidden;font:600 15.5px var(--f-body);letter-spacing:.01em;padding:17px 18px;border:0;border-radius:999px;background:var(--accent-grad);color:var(--accent-ink);cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 12px 24px -12px color-mix(in srgb,var(--accent) 70%,transparent);transition:transform .15s}
.cta::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-100%);animation:ctaSheen 3.6s 1s ease-in-out infinite}
@keyframes ctaSheen{0%,70%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.cta:active{transform:scale(.98)}
.cta svg{width:18px;height:18px}
.cta.soft{background:var(--surface2);color:var(--ink);box-shadow:none}
.cta.soft::after{display:none}
.reg .fine{display:flex;gap:10px;align-items:flex-start;font-size:12px;color:var(--muted);line-height:1.5;margin-top:auto;padding-top:10px}
.reg .fine svg{width:16px;height:16px;flex:none;color:var(--accent);margin-top:1px}
.reg .perks{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.reg .perks span{font-size:12px;padding:7px 11px;border-radius:999px;background:var(--surface2);color:var(--ink);display:flex;gap:6px;align-items:center}
.reg .perks b{color:var(--cash);font-weight:700}

/* ================= App header & catalog ================= */
.hdr{display:flex;align-items:center;gap:12px;padding:10px 18px 12px}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:600 14px var(--f-body);background:var(--accent-grad);color:var(--accent-ink);flex:none;letter-spacing:.03em}
.greet{display:flex;flex-direction:column;min-width:0;flex:1}
.greet small{font-size:12.5px;color:var(--muted)}
.greet b{font-size:22px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cpill{display:flex;align-items:center;gap:7px;padding:8px 12px 8px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--hair);font:600 13px var(--f-num);color:var(--ink);cursor:pointer;box-shadow:var(--shadow);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.coin{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF1C9,#D9AE5C 55%,#9C7330);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.45)}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-md);padding:0 6px 0 14px;margin-bottom:16px;box-shadow:var(--shadow);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.search>svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{border:0;background:transparent;font:500 14.5px var(--f-body);color:var(--ink);padding:14px 0;width:100%;outline:none;min-width:0}
.search .flt{width:36px;height:36px;border-radius:11px;border:0;background:var(--surface2);color:var(--ink);display:grid;place-items:center;flex:none;cursor:pointer}
.search .flt svg{width:17px;height:17px}

.club{position:relative;border-radius:var(--r-xl);padding:18px 18px 16px;background:var(--club);color:var(--club-ink);overflow:hidden;margin-bottom:22px;box-shadow:0 22px 40px -24px rgba(0,0,0,.55)}
.club::before{content:"";position:absolute;inset:0;background:
  repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 1px,transparent 1px 7px),
  radial-gradient(120% 80% at 100% 0%,rgba(255,255,255,.18),transparent 55%);pointer-events:none}
.club::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.22) 50%,transparent 60%);transform:translateX(-100%);animation:clubSheen 6s 1.5s ease-in-out infinite;pointer-events:none}
@keyframes clubSheen{0%,75%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.club .ct{position:relative;display:flex;justify-content:space-between;align-items:center}
.club .lg{display:flex;align-items:center;gap:8px;font:600 12px var(--f-body);letter-spacing:.2em;text-transform:uppercase}
.club .lg svg{width:22px;height:22px;color:var(--club-acc)}
.club .tier{font:600 11px var(--f-body);letter-spacing:.14em;text-transform:uppercase;padding:5px 9px;border-radius:999px;border:1px solid var(--club-line);color:var(--club-acc)}
.club .cm{position:relative;margin:22px 0 16px}
.club .cm small{font-size:12px;opacity:.7;letter-spacing:.02em}
.club .cm b{display:block;font-size:36px;line-height:1.05;margin-top:4px}
.club .cm b em{font-style:normal;font-size:15px;opacity:.7;margin-left:6px;font-family:var(--f-body);font-weight:500}
.club .cb{position:relative;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:12px;border-top:1px solid var(--club-line);font-size:12.5px}
.club .cb span{opacity:.8}
.club .cb button{font:600 12.5px var(--f-body);padding:9px 13px;border-radius:999px;border:0;background:var(--club-acc);color:#14110A;cursor:pointer;display:flex;align-items:center;gap:6px}
.club .cb button svg{width:15px;height:15px}

.cats{display:flex;gap:10px;overflow-x:auto;margin:0 -18px 22px;padding:2px 18px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:0;cursor:pointer;color:var(--ink);font:500 11.5px var(--f-body);width:64px}
.cat i{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--hair);box-shadow:var(--shadow);transition:.2s;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.cat i svg{width:24px;height:24px;color:var(--ink)}
.cat.on i{background:var(--accent-grad);border-color:transparent}
.cat.on i svg{color:var(--accent-ink)}
.cat span{text-align:center;line-height:1.2;white-space:nowrap}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 12px}
.sec h4{margin:0;font-size:24px;line-height:1}
.sec small{color:var(--muted);font-size:12.5px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pc{position:relative;background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-lg);padding:6px 6px 10px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:var(--shadow);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);animation:cardIn .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes cardIn{from{transform:translateY(8px)}to{transform:none}}
.pc .im{position:relative;aspect-ratio:1/1.02;max-width:100%;border-radius:calc(var(--r-lg) - 5px);display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(100% 80% at 50% 25%,color-mix(in srgb,var(--pc) 18%,var(--card-tint)),var(--card-tint) 72%)}
.pc .im svg.art{width:92%;height:92%;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.pc:hover .im svg.art{transform:translateY(-3px) scale(1.03)}
.fav{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;border:0;background:color-mix(in srgb,var(--surface) 85%,transparent);color:var(--ink);display:grid;place-items:center;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.fav svg{width:15px;height:15px}
.fav.on{color:#E0475B}
.fav.on svg{fill:currentColor}
.cbb{position:absolute;left:8px;top:8px;font:700 10.5px var(--f-num);padding:4px 7px;border-radius:999px;background:color-mix(in srgb,var(--surface) 85%,transparent);color:var(--cash);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.pc .pi{display:flex;flex-direction:column;gap:3px;padding:0 6px;min-width:0}
.pc .pn{font-weight:600;font-size:14.5px;line-height:1.2;letter-spacing:-.01em}
.pc .pd{font-size:11.5px;color:var(--muted);line-height:1.35}
.pc .pr{font:700 16px var(--f-num);margin-top:5px;letter-spacing:-.01em}
.pc .pr small{font-size:11px;color:var(--muted);font-weight:500;margin-left:2px}
.buy{margin:2px 6px 0;font:600 13px var(--f-body);padding:11px 10px;border:0;border-radius:999px;background:var(--ink);color:var(--surface-solid,#fff);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:transform .15s}
.buy:active{transform:scale(.96)}
.buy svg{width:16px;height:16px}
.empty{padding:44px 10px;text-align:center;color:var(--muted);line-height:1.6}
.empty b{display:block;font-size:24px;color:var(--ink);margin-bottom:6px}

/* ================= Cart ================= */
.ph{display:flex;justify-content:space-between;align-items:baseline;margin:8px 0 18px}
.ph{gap:12px}
.ph h3{margin:0;font-size:36px;line-height:1;white-space:nowrap}
.ph small{color:var(--muted);font-size:13px;text-align:right}
.ci{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;padding:8px;background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-lg);margin-bottom:10px;box-shadow:var(--shadow);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.ci .th{width:72px;height:72px;border-radius:16px;display:grid;place-items:center;background:radial-gradient(100% 80% at 50% 25%,color-mix(in srgb,var(--pc) 18%,var(--card-tint)),var(--card-tint) 72%)}
.ci .th svg{width:92%;height:92%}
.ci .cx{display:flex;flex-direction:column;gap:6px;min-width:0;padding-right:4px}
.ci .nm{font-weight:600;font-size:14.5px;line-height:1.2}

function fakeQR(el,text){
  const n=25,cv=document.createElement("canvas"),s=180;cv.width=cv.height=s;const x=cv.getContext("2d"),u=s/n;
  let h=7;for(const ch of text)h=(h*31+ch.charCodeAt(0))>>>0;

  x.fillStyle="#fff";x.fillRect(0,0,s,s);x.fillStyle="#111";
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){const f=(i<8&&j<8)||(i>n-9&&j<8)||(i<8&&j>n-9);if(!f&&rnd()>.5)x.fillRect(i*u,j*u,u,u)}
  const fd=(a,b)=>{x.fillStyle="#111";x.fillRect(a*u,b*u,7*u,7*u);x.fillStyle="#fff";x.fillRect((a+1)*u,(b+1)*u,5*u,5*u);x.fillStyle="#111";x.fillRect((a+2)*u,(b+2)*u,3*u,3*u)};
  fd(0,0);fd(n-7,0);fd(0,n-7);el.appendChild(cv);
}

function countUp(el,to,dur=900){
  const t0=performance.now();
  let reduce=false;try{reduce=matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){}
  if(reduce){el.textContent=fmtN(to);return}
  const step=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=fmtN(to*e);if(k<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}

  function success(title,text,amount,go){

  function fly(btn,p){
    const target=view.querySelector('.nav [data-go="cart"]');if(!target)return;
    const sr=screen.getBoundingClientRect(),br=btn.getBoundingClientRect(),tr=target.getBoundingClientRect();

    requestAnimationFrame(()=>requestAnimationFrame(()=>{f.style.transform=`translate(${tr.left-sr.left+tr.width/2-22-x0}px,${tr.top-sr.top-y0}px) scale(.35)`;f.style.opacity=".25"}));

  }

  view.addEventListener("submit",e=>{

  view.addEventListener("input",e=>{

  });
  view.addEventListener("change",e=>{if(e.target.matches("[data-use]")){S.useCash=e.target.checked;render(true)}});
  view.addEventListener("click",e=>{
    const b=e.target.closest("button");if(!b)return;
    const d=b.dataset;
    if(d.go){S.tab=d.go;render();return}
    if(d.cat){S.cat=d.cat;render(true);return}
    if(d.hf){S.hf=d.hf;render(true);return}
    if(d.fav){const id=+d.fav;S.fav=S.fav.includes(id)?S.fav.filter(x=>x!==id):[...S.fav,id];b.classList.toggle("on");save();return}
    if(d.buy){
      if(b.disabled)return;b.disabled=true;
      const p=PRODUCTS.find(x=>x.id==d.buy);S.cart[p.id]=(S.cart[p.id]||0)+1;save();fly(b,p);
      const cartBtn=view.querySelector('.nav [data-go="cart"]');
      setTimeout(()=>{if(cartBtn){cartBtn.querySelector(".badge")?.remove();cartBtn.insertAdjacentHTML("beforeend",`<span class="badge pop">${count()}</span>`)}},580);
      setTimeout(()=>{S.tab="cart";render();toast(p.n+" savatga qo'shildi")},900);return}
    if(d.inc){S.cart[d.inc]++;save();render(true);return}
    if(d.dec){if(--S.cart[d.dec]<=0)delete S.cart[d.dec];save();render(true);return}
    if("checkout" in d){
      const t=total(),use=S.useCash?Math.min(S.balance,t):0,pay=t-use,cb=Math.round(pay*RATE),no=10483+S.history.filter(h=>h.type==="online"&&!h.seed).length;
      S.history.unshift({t:"Onlayn buyurtma №"+no,s:"Qabul qilindi · "+count()+" ta mahsulot",d:now(),total:t,cb,used:use,type:"online"});

    if("scan" in d){
      const box=view.querySelector(".qrbox");if(box.classList.contains("scanning"))return;
      const lbl=b.querySelector("span");box.classList.add("scanning");b.disabled=true;lbl.textContent="Skanerlanmoqda…";
      setTimeout(()=>{
        const t=[48500,96000,152000,23500][Math.floor(Math.random()*4)],cb=Math.round(t*RATE);
        S.history.unshift({t:"Imron Med · Chilonzor",s:"QR orqali · kassa №2",d:now(),total:t,cb,type:"store"});
        S.balance+=cb;save();box.classList.remove("scanning");b.disabled=false;lbl.textContent="Kassada skanerlashni sinash";
        success("Keshbek qo'shildi",`Kassa ${fmt(t)} lik xaridni tasdiqladi.`,cb,"wallet");
      },2700);return}
    if("logout" in d){if(!demo)api.reset();return}
  });

  const api=demo
    ?{replay(){if(opts.screen==="splash")splash(true)},reset(){},start(){if(opts.screen==="splash")return splash(true);render()}}
    :{replay:()=>splash(),reset(){try{localStorage.removeItem(KEY)}catch(e){}Object.assign(S,{user:null,cart:{},balance:0,history:[],tab:"catalog",cat:"Hammasi",q:"",useCash:false,hf:"all"});delete S._d;delete S._e;splash()},start:()=>splash()};
  return api;
}

    const w=document.createElement("section");w.className="variant";
    w.innerHTML=`<div class="vhead"><span class="num">Variant ${i+1}</span><h2>${v.name}</h2><p>${v.desc}</p><div class="swatches">${v.sw.map(c=>`<i style="background:${c}"></i>`).join("")}</div></div><div class="host"></div>`;
    gallery.appendChild(w);const a=App(w.querySelector(".host"),v);apps.push(a);a.start();
  });
}
function showAll(id){
  const v=VARIANTS.find(x=>x.id===id);gallery.innerHTML="";apps=[];
  hint.textContent=`«${v.name}» variantining barcha oynalari to'liq uzunlikda. Ma'lumotlar namuna.`;
  SCREENS.forEach(([screen,tab,title,sub],i)=>{
    const w=document.createElement("section");w.className="variant";
    w.innerHTML=`<div class="vhead"><span class="num">${v.name} · oyna ${i+1}</span><h2>${title}</h2><p>${sub}</p></div><div class="host"></div>`;
    gallery.appendChild(w);const a=App(w.querySelector(".host"),v,{demo:true,screen,tab,cart:tab==="cart"?{3:1,7:1,9:1}:{}});apps.push(a);a.start();
  });
}
const vseg=document.getElementById("vseg");
vseg.innerHTML=VARIANTS.map(v=>`<button type="button" class="pbtn" data-v="${v.id}">${v.name}</button>`).join("");
document.querySelector(".modes").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  document.querySelectorAll(".modes button").forEach(x=>x.classList.toggle("on",x===b));
  b.dataset.v?showAll(b.dataset.v):showLive();
  try{history.replaceState(null,"","#"+(b.dataset.v||"live"))}catch(err){}
});
document.getElementById("replay").onclick=()=>apps.forEach(a=>a.replay());
document.getElementById("reset").onclick=()=>apps.forEach(a=>a.reset());
const h0=(location.hash||"").slice(1);
(VARIANTS.some(v=>v.id===h0)?vseg.querySelector(`[data-v="${h0}"]`):document.querySelector('[data-mode="live"]')).click();
</script>
